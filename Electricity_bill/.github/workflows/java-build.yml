name: Electricity Billing System Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    
    - name: Analyze project structure
      run: |
        echo "🔍 Project structure analysis:"
        echo "- Main class: src/Main.java"
        echo "- Controllers: $(find src/Electricity/controller -name "*.java" | wc -l) files"
        echo "- Models: $(find src/Electricity/model -name "*.java" | wc -l) files"
        echo "- Views: $(find src/Electricity/view -name "*.java" | wc -l) files"
        echo "- DAOs: $(find src/Electricity/dataAccessOutput -name "*.java" | wc -l) files"
        echo "- Utilities: $(find src/Electricity/util -name "*.java" | wc -l) files"
        echo "- Test files: $(find test -name "*.java" | wc -l) files"
    
    - name: Install rs2xml locally
      run: |
        mkdir -p $HOME/.m2/repository/net/sourceforge/rs2xml/rs2xml/1.0/
        cp lib/rs2xml.jar $HOME/.m2/repository/net/sourceforge/rs2xml/rs2xml/1.0/rs2xml-1.0.jar
        echo '<?xml version="1.0" encoding="UTF-8"?><project><modelVersion>4.0.0</modelVersion><groupId>net.sourceforge.rs2xml</groupId><artifactId>rs2xml</artifactId><version>1.0</version></project>' > $HOME/.m2/repository/net/sourceforge/rs2xml/rs2xml/1.0/rs2xml-1.0.pom
        
    - name: Build with Maven
      run: mvn -B clean compile
      
    - name: Test ValidationUtil only
      run: |
        echo "🧪 Running ValidationUtil tests only"
        # Temporarily enable tests for ValidationUtil
        mvn -B test -Dtest="Electricity.util.ValidationUtilTest" -DskipTests=false || echo "ValidationUtil tests failed but continuing build"
      
    - name: Create JAR with Maven
      run: mvn -B package -DskipTests
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: target/surefire-reports/
        if-no-files-found: ignore
      
    - name: Upload compiled artifacts
      uses: actions/upload-artifact@v3
      with:
        name: electricity-billing-system-build
        path: |
          target/*.jar
          README.md
        if-no-files-found: warn
      
    - name: Summary
      if: always()
      run: |
        echo "✨ Build and Test Summary for Electricity Billing System:"
        echo "- Java Version: $(java -version 2>&1 | head -n 1)"
        echo "- Last commit: $(git log -1 --pretty=format:'%h - %s (%an, %ar)')"
        
        echo "- JAR files created:"
        ls -lh target/*.jar 2>/dev/null | awk '{print "  - " $9 " (" $5 ")"}' || echo "  No JAR files created"
        
        if [ -d "target/surefire-reports" ]; then
          echo "- ValidationUtil test results (partial):"
          grep -r "Tests run:" target/surefire-reports --include="*ValidationUtilTest*" || echo "  No ValidationUtil test results found"
        fi